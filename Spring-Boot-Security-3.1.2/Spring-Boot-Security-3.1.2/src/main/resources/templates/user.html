<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Admin panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Убираем желтые поля автозаполнения */
        input:-webkit-autofill, input:-webkit-autofill:hover, input:-webkit-autofill:focus, input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px white inset !important;
            -webkit-text-fill-color: black !important;
        }
    </style>
</head>
<body>
<!-- Тёмная шапка -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1 text-white" th:text="${username} + ' with roles: ' + ${role}">admin@mail.ru with roles: ADMIN USER</span>
        <a th:href="@{/logout}" class="btn btn-outline-light btn-sm">Logout</a>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <!-- Сайдбар -->
        <div class="col-md-2 bg-light vh-100 p-3">
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link active bg-primary text-white" th:href="@{/admin}">Admin</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-primary" th:href="@{/user}">User</a>
                </li>
            </ul>
        </div>

        <!-- Основной контент -->
        <div class="col-md-10 p-4">
            <h2 class="mb-4">Admin panel</h2>
            <ul class="nav nav-tabs mb-3">
                <li class="nav-item"><a class="nav-link active" href="#">Users table</a></li>
                <!-- Кнопка открывает модалку добавления. Убираем ссылку, чтобы не ловить 404 -->
                <li class="nav-item">
                    <button class="nav-link" data-bs-toggle="modal" data-bs-target="#addUserModal" style="border: none; background: none;">New User</button>
                </li>
            </ul>

            <div class="card">
                <div class="card-header">All users</div>
                <div class="card-body">
                    <table class="table table-striped">
                        <thead>
                        <tr>
                            <th>ID</th><th>First Name</th><th>Last Name</th><th>Age</th><th>Email</th><th>Role</th><th>Edit</th><th>Delete</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="user : ${users}">
                            <td th:text="${user.id}">2</td>
                            <td th:text="${user.firstName}">admin</td>
                            <td th:text="${user.lastName}">admin</td>
                            <td th:text="${user.age}">35</td>
                            <td th:text="${user.email}">admin@mail.ru</td>
                            <td th:text="${user.role}">ADMIN USER</td>
                            <td>
                                <button type="button" class="btn btn-info btn-sm"
                                        data-bs-toggle="modal" data-bs-target="#editModal"
                                        th:attr="data-id=${user.id}, data-firstname=${user.firstName}, data-lastname=${user.lastName}, data-age=${user.age}, data-email=${user.email}, data-role=${user.role}">
                                    Edit
                                </button>
                            </td>
                            <td>
                                <button type="button" class="btn btn-danger btn-sm"
                                        data-bs-toggle="modal" data-bs-target="#deleteModal"
                                        th:attr="data-id=${user.id}, data-firstname=${user.firstName}, data-lastname=${user.lastName}, data-age=${user.age}, data-email=${user.email}, data-role=${user.role}">
                                    Delete
                                </button>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Модалка Добавления (New User) - отправляет на ваш существующий @PostMapping("/add") -->
<div class="modal fade" id="addUserModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add new user</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body text-center" style="max-width: 400px; margin: 0 auto;">
                <!-- Обратите внимание: action="@{/admin/add}" -->
                <form th:action="@{/admin/add}" method="post" autocomplete="off">
                    <div class="mb-3"><label class="form-label w-100 text-start">First name</label><input type="text" name="firstName" class="form-control"></div>
                    <div class="mb-3"><label class="form-label w-100 text-start">Last name</label><input type="text" name="lastName" class="form-control"></div>
                    <div class="mb-3"><label class="form-label w-100 text-start">Age</label><input type="number" name="age" class="form-control"></div>
                    <div class="mb-3"><label class="form-label w-100 text-start">Email</label><input type="email" name="email" class="form-control"></div>
                    <div class="mb-3"><label class="form-label w-100 text-start">Password</label><input type="password" name="password" class="form-control" autocomplete="new-password"></div>

                    <div class="mb-3">
                        <label class="form-label w-100 text-start">Role</label>
                        <!-- Обязательно name="roleIds" и multiple, так как в контроллере Set<Long> -->
                        <select name="roleIds" class="form-select" multiple size="2">
                            <!-- Подставьте ID ролей из вашей БД (обычно 1, 2) -->
                            <option value="1">ADMIN</option>
                            <option value="2">USER</option>
                        </select>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="submit" class="btn btn-success">Add new user</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Модалка Редактирования (Edit) - отправляет на ваш существующий @PostMapping("/update") -->
<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Edit user</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form th:action="@{/admin/update}" method="post">
                    <input type="hidden" id="edit_id" name="id">
                    <div class="mb-3"><label>First name</label><input type="text" class="form-control" id="edit_firstName" name="firstName"></div>
                    <div class="mb-3"><label>Last name</label><input type="text" class="form-control" id="edit_lastName" name="lastName"></div>
                    <div class="mb-3"><label>Age</label><input type="number" class="form-control" id="edit_age" name="age"></div>
                    <div class="mb-3"><label>Email</label><input type="email" class="form-control" id="edit_email" name="email"></div>
                    <div class="mb-3"><label>Password</label><input type="password" class="form-control" name="password" placeholder="Оставьте пустым, чтобы не менять"></div>
                    <div class="mb-3">
                        <label>Role</label>
                        <select class="form-select" id="edit_role" name="roleIds" multiple size="2">
                            <option value="1">ADMIN</option>
                            <option value="2">USER</option>
                        </select>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="submit" class="btn btn-primary">Edit</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Модалка Удаления (Delete) - отправляет на ваш существующий @PostMapping("/delete") -->
<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Delete user</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form th:action="@{/admin/delete}" method="post">
                    <input type="hidden" id="delete_id" name="id">
                    <div class="mb-3"><label>First name</label><input type="text" class="form-control bg-secondary bg-opacity-10" id="delete_firstName" disabled></div>
                    <div class="mb-3"><label>Last name</label><input type="text" class="form-control bg-secondary bg-opacity-10" id="delete_lastName" disabled></div>
                    <div class="mb-3"><label>Age</label><input type="text" class="form-control bg-secondary bg-opacity-10" id="delete_age" disabled></div>
                    <div class="mb-3"><label>Email</label><input type="text" class="form-control bg-secondary bg-opacity-10" id="delete_email" disabled></div>
                    <div class="mb-3"><label>Role</label><input type="text" class="form-control bg-secondary bg-opacity-10" id="delete_role" disabled></div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="submit" class="btn btn-danger">Delete</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Скрипты для работы модалок -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Заполнение модалки Edit
    document.getElementById('editModal').addEventListener('show.bs.modal', function (event) {
        var button = event.relatedTarget;
        document.getElementById('edit_id').value = button.getAttribute('data-id');
        document.getElementById('edit_firstName').value = button.getAttribute('data-firstname');
        document.getElementById('edit_lastName').value = button.getAttribute('data-lastname');
        document.getElementById('edit_age').value = button.getAttribute('data-age');
        document.getElementById('edit_email').value = button.getAttribute('data-email');
        document.getElementById('edit_role').value = button.getAttribute('data-role');
    });

    // Заполнение модалки Delete
    document.getElementById('deleteModal').addEventListener('show.bs.modal', function (event) {
        var button = event.relatedTarget;
        document.getElementById('delete_id').value = button.getAttribute('data-id');
        document.getElementById('delete_firstName').value = button.getAttribute('data-firstname');
        document.getElementById('delete_lastName').value = button.getAttribute('data-lastname');
        document.getElementById('delete_age').value = button.getAttribute('data-age');
        document.getElementById('delete_email').value = button.getAttribute('data-email');
        document.getElementById('delete_role').value = button.getAttribute('data-role');
    });
</script>
</body>
</html>
