<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Admin panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1 text-white" th:text="${username} + ' with roles: ' + ${role}">admin@mail.ru with roles: ADMIN USER</span>
        <a th:href="@{/logout}" class="btn btn-outline-light btn-sm">Logout</a>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 bg-light vh-100 p-3">
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link active bg-primary text-white" th:href="@{/admin}">Admin</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-primary" th:href="@{/user}">User</a>
                </li>
            </ul>
        </div>

        <div class="col-md-10 p-4">
            <h2 class="mb-4">Admin panel</h2>
            <ul class="nav nav-tabs mb-3">
                <li class="nav-item"><a class="nav-link active" href="#">Users table</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/admin/}">New User</a></li>
            </ul>

            <div class="card">
                <div class="card-header">All users</div>
                <div class="card-body">
                    <table class="table table-striped">
                        <thead>
                        <tr>
                            <th>ID</th><th>First Name</th><th>Last Name</th><th>Age</th><th>Email</th><th>Role</th><th>Edit</th><th>Delete</th>
                        </tr>
                        </thead>
                        <tbody>
                        <!-- Цикл по пользователям -->
                        <tr th:each="user : ${users}">
                            <td th:text="${user.id}">2</td>
                            <td th:text="${user.firstName}">admin</td>
                            <td th:text="${user.lastName}">admin</td>
                            <td th:text="${user.age}">35</td>
                            <td th:text="${user.email}">admin@mail.ru</td>
                            <td th:text="${user.role}">ADMIN USER</td>
                            <td>
                                <button type="button" class="btn btn-info btn-sm"
                                        data-bs-toggle="modal" data-bs-target="#editModal"
                                        th:attr="data-id=${user.id}, data-firstname=${user.firstName}, data-lastname=${user.lastName}, data-age=${user.age}, data-email=${user.email}, data-role=${user.role}">
                                    Edit
                                </button>
                            </td>
                            <td>
                                <button type="button" class="btn btn-danger btn-sm"
                                        data-bs-toggle="modal" data-bs-target="#deleteModal"
                                        th:attr="data-id=${user.id}, data-firstname=${user.firstName}, data-lastname=${user.lastName}, data-age=${user.age}, data-email=${user.email}, data-role=${user.role}">
                                    Delete
                                </button>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('editModal').addEventListener('show.bs.modal', function (event) {
        var button = event.relatedTarget;
        document.getElementById('edit_id').value = button.getAttribute('data-id');
        document.getElementById('edit_firstName').value = button.getAttribute('data-firstname');
        document.getElementById('edit_lastName').value = button.getAttribute('data-lastname');
        document.getElementById('edit_age').value = button.getAttribute('data-age');
        document.getElementById('edit_email').value = button.getAttribute('data-email');
        document.getElementById('edit_role').value = button.getAttribute('data-role');
    });

    document.getElementById('deleteModal').addEventListener('show.bs.modal', function (event) {
        var button = event.relatedTarget;
        document.getElementById('delete_id').value = button.getAttribute('data-id');
        document.getElementById('delete_firstName').value = button.getAttribute('data-firstname');
        document.getElementById('delete_lastName').value = button.getAttribute('data-lastname');
        document.getElementById('delete_age').value = button.getAttribute('data-age');
        document.getElementById('delete_email').value = button.getAttribute('data-email');
        document.getElementById('delete_role').value = button.getAttribute('data-role');
    });
</script>
</body>
</html>
