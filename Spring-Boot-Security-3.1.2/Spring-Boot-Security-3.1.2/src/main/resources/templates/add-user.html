<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add new user</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        input:-webkit-autofill, input:-webkit-autofill:hover, input:-webkit-autofill:focus, input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px white inset !important;
            -webkit-text-fill-color: black !important;
        }
    </style>
</head>
<body>
<!-- шапка -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1 text-white" th:text="${username} + ' with roles: ' + ${role}">admin@mail.ru with roles: ADMIN USER</span>
        <a th:href="@{/logout}" class="btn btn-outline-light btn-sm">Logout</a>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <!-- Сайдбар -->
        <div class="col-md-2 bg-light vh-100 p-3">
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link active bg-primary text-white" th:href="@{/admin}">Admin</a></li>
                <li class="nav-item"><a class="nav-link text-primary" th:href="@{/user}">User</a></li>
            </ul>
        </div>

        <div class="col-md-10 p-4">
            <h2 class="mb-4">Admin panel</h2>
            <ul class="nav nav-tabs mb-3">
                <li class="nav-item"><a class="nav-link" th:href="@{/admin}">Users table</a></li>
                <li class="nav-item"><a class="nav-link active" href="#">New User</a></li>
            </ul>

            <div class="card">
                <div class="card-header">Add new user</div>
                <div class="card-body text-center" style="max-width: 400px; margin: 0 auto;">
                    <!-- Отправляем на существующий POST метод -->
                    <form th:action="@{/admin/add}" method="post" autocomplete="off">
                        <div class="mb-3">
                            <label class="form-label w-100 text-start">First name</label>
                            <input type="text" name="firstName" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label w-100 text-start">Last name</label>
                            <input type="text" name="lastName" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label w-100 text-start">Age</label>
                            <input type="number" name="age" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label w-100 text-start">Email</label>
                            <input type="email" name="email" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label w-100 text-start">Password</label>
                            <input type="password" name="password" class="form-control" autocomplete="new-password">
                        </div>
                        <div class="mb-3">
                            <label class="form-label w-100 text-start">Role</label>
                            <!-- ВАЖНО: name="roleIds" и multiple (Set<Long> в контроллере) -->
                            <select name="roleIds" class="form-select" multiple size="2">
                                <!-- Подставьте ваши ID из базы данных -->
                                <option value="1">ADMIN</option>
                                <option value="2">USER</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-success px-4">Add new user</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
