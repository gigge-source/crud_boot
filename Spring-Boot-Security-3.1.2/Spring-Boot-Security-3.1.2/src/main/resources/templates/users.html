<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin panel</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- ================= НАВБАР ================= -->
<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-text text-white">
        <span th:text="${currentUser}"></span> with roles: ADMIN USER
    </span>
    <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
</nav>

<div class="container-fluid mt-3">
    <div class="row">

        <!-- ================= ЛЕВОЕ МЕНЮ ================= -->
        <div class="col-md-2">
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link active bg-primary text-white" href="/admin">Admin</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">User</a>
                </li>
            </ul>
        </div>

        <!-- ================= ОСНОВНАЯ ЧАСТЬ ================= -->
        <div class="col-md-10">
            <h1>Admin panel</h1>

            <!-- Вкладки -->
            <ul class="nav nav-tabs mb-3">
                <li class="nav-item">
                    <a class="nav-link active" href="#">Users table</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/add-user}">New user</a>
                </li>
            </ul>

            <h3>All users</h3>

            <!-- ================= ТАБЛИЦА ================= -->
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Age</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Edit</th>
                    <th>Delete</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.id}"></td>
                    <td th:text="${user.firstName}"></td>
                    <td th:text="${user.lastName}"></td>
                    <td th:text="${user.age}"></td>
                    <td th:text="${user.email}"></td>
                    <td>
                        <span th:each="role, iter : ${user.roles}"
                              th:text="${role.name + (!iter.last ? ', ' : '')}"></span>
                    </td>
                    <td>
                        <button type="button" class="btn btn-info btn-sm"
                                data-bs-toggle="modal"
                                th:attr="data-bs-target='#editModal-' + ${user.id}">
                            Edit
                        </button>
                    </td>
                    <td>
                        <button type="button" class="btn btn-danger btn-sm"
                                data-bs-toggle="modal"
                                th:attr="data-bs-target='#deleteModal-' + ${user.id}">
                            Delete
                        </button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>


<!-- ================= МОДАЛКИ (для каждого пользователя) ================= -->
<div th:each="user : ${users}">

    <!-- DELETE MODAL -->
    <div class="modal fade" th:id="'deleteModal-' + ${user.id}" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">

                <form th:action="@{/admin/delete}" method="post">
                    <div class="modal-header">
                        <h5 class="modal-title">Delete user</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body">
                        <input type="hidden" name="id" th:value="${user.id}">

                        <label class="form-label fw-bold">ID</label>
                        <input type="text" class="form-control mb-2"
                               th:value="${user.id}" readonly>

                        <label class="form-label fw-bold">First name</label>
                        <input type="text" class="form-control mb-2"
                               th:value="${user.firstName}" readonly>

                        <label class="form-label fw-bold">Last name</label>
                        <input type="text" class="form-control mb-2"
                               th:value="${user.lastName}" readonly>

                        <label class="form-label fw-bold">Age</label>
                        <input type="text" class="form-control mb-2"
                               th:value="${user.age}" readonly>

                        <label class="form-label fw-bold">Email</label>
                        <input type="text" class="form-control mb-2"
                               th:value="${user.email}" readonly>

                        <label class="form-label fw-bold">Role</label>
                        <input type="text" class="form-control mb-2" readonly
                               th:value="${#strings.setJoin(user.roles.![name], ', ')}">
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="submit" class="btn btn-danger">Delete</button>
                    </div>
                </form>

            </div>
        </div>
    </div>


    <!-- EDIT MODAL -->
    <div class="modal fade" th:id="'editModal-' + ${user.id}" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">

                <form th:action="@{/admin/update}" method="post">
                    <div class="modal-header">
                        <h5 class="modal-title">Edit user</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body">
                        <input type="hidden" name="id" th:value="${user.id}">

                        <label class="form-label fw-bold">ID</label>
                        <input type="text" class="form-control mb-2"
                               th:value="${user.id}" readonly>

                        <label class="form-label fw-bold">First name</label>
                        <input type="text" name="firstName" class="form-control mb-2"
                               th:value="${user.firstName}">

                        <label class="form-label fw-bold">Last name</label>
                        <input type="text" name="lastName" class="form-control mb-2"
                               th:value="${user.lastName}">

                        <label class="form-label fw-bold">Age</label>
                        <input type="number" name="age" class="form-control mb-2"
                               th:value="${user.age}">

                        <label class="form-label fw-bold">Email</label>
                        <input type="email" name="email" class="form-control mb-2"
                               th:value="${user.email}">

                        <label class="form-label fw-bold">Password</label>
                        <input type="password" name="password" class="form-control mb-2"
                               placeholder="оставь пустым, если не менять">

                        <label class="form-label fw-bold">Role</label>
                        <select name="roleIds" class="form-select mb-2" multiple size="2">
                            <option value="1"
                                    th:selected="${user.roles != null and user.roles.![id].contains(1)}">
                                ADMIN
                            </option>
                            <option value="2"
                                    th:selected="${user.roles != null and user.roles.![id].contains(2)}">
                                USER
                            </option>
                        </select>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="submit" class="btn btn-primary">Edit</button>
                    </div>
                </form>

            </div>
        </div>
    </div>

</div>


<!-- ================= BOOTSTRAP JS ================= -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
